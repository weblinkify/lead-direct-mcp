[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leaddirect-mcp"
version = "1.0.0"
description = "MCP server that finds B2B companies and collects the contact details they publish: emails, phones and social links."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.10",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "ddgs>=9.0",
  "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
leaddirect = "leaddirect.server:main"

[tool.setuptools]
packages = ["leaddirect"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
